[project]
name = "bytetrack"
version = "0.1.0"
description = "ByteTrack: recepción de equipos y órdenes de servicio (iteración C1)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
